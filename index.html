<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Link to our external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main container for our original website content -->
    <main class="container">
        <!-- Original Skeleton Content -->
        <h1>Hello, World! 👋</h1>
        <p>Welcome to my brand new website hosted on GitHub Pages.</p>
        
        <!-- Original interactive button -->
        <button id="colorBtn">Click Me!</button>

        <!-- Visual separator for the game section -->
        <hr class="section-divider">

        <!-- Video Game Section (Placed right after the original content) -->
        <section class="game-section">
            <h2>⭐ Star Catcher Game</h2>
            <p>Score: <span id="score">0</span></p>
            <button id="gameBtn">Click the Star!</button>
        </section>
    </main>

    <!-- Link to our external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
