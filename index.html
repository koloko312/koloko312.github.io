<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Awesome Website</title>
    <!-- Link to your external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Left-side Mini-Game Button -->
    <button id="minigame-btn" class="side-btn">Play Mini-Game!</button>

    <!-- Main Content Container -->
    <main class="container">
        <h1>Welcome to My Website!</h1>
        <p>Explore around and click the button on the left to play a fun game!</p>
    </main>

    <!-- Mini-Game Modal Popup Container -->
    <div id="game-modal" class="modal hidden">
        <div class="modal-content">
            <!-- Close button for the modal -->
            <span id="close-modal" class="close">&times;</span>
            <h2>Number Guessing Mini-Game!</h2>
            <p>I'm thinking of a number between 1 and 10. Can you guess it?</p>
            <input type="number" id="user-guess" min="1" max="10" placeholder="Enter 1-10">
            <button id="guess-btn">Submit Guess</button>
            <p id="game-message"></p>
        </div>
    </div>

    <!-- Link to your external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
